name: CI

on:
  push:
    branches: [ main, 'fix/*', 'feat/*' ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Typecheck, Test & Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Export Web Production Bundle
        run: npx expo export --platform web --clear
